name: AgentAudit
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  security-events: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run build
      - run: node --test test/*.test.js
      - name: Detection still fires on the vulnerable fixture
        run: |
          set +e
          node dist/cli.js test/fixtures/vulnerable-agent --fail-on high
          [ $? -ne 0 ] || { echo "::error::detection regressed"; exit 1; }
      - name: Secure fixture stays clean
        run: node dist/cli.js test/fixtures/secure-agent --fail-on low
      - name: Report
        if: always()
        run: node dist/cli.js test/fixtures/vulnerable-agent --format markdown --fail-on none >> "$GITHUB_STEP_SUMMARY"
